<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Edgekin 0.2 动作验证</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#fafafa;color:#242424;font:16px system-ui}
  header{padding:28px 36px;max-width:720px}h1{font-size:24px}p{line-height:1.7}
  .block{position:absolute;border:1px solid #bac7d2;background:#edf2f5;border-radius:4px;padding:12px}
  #floor{left:70px;top:740px;width:390px;height:35px}
  #beam{left:180px;top:686px;width:200px;height:30px}
  #launch{left:540px;top:600px;width:195px;height:45px}
  #wall{left:800px;top:350px;width:175px;height:350px}
  #upper{left:1080px;top:290px;width:210px;height:45px}
  #turn{left:950px;top:190px;width:150px;height:40px}
  .badge{position:absolute;top:480px;left:1100px;width:30px;height:30px;border-radius:50%;background:#cbdaf1}
</style>
<header data-edgekin-ignore><h1>动作验证场</h1><p>←/→ 移动；↑ 跳跃，贴墙时再次按 ↑ 借墙反跳；↓ 下蹲穿过低处。暂停面板可以回起点。</p><input id="host-input" placeholder="点击这里检查自动暂停"><button id="layout">移动网页障碍</button></header>
<main><div id="floor" class="block">低矮通道地面</div><div id="beam" class="block">横梁</div><div id="launch" class="block">起跳边</div><div id="wall" class="block">借墙到高处</div><div id="upper" class="block">高处落脚边</div><div id="turn" class="block">折返</div><span class="badge"></span></main>
<script type="module">
  import {mountEdgekin} from '/dist/index.js';
  window.edgekin=mountEdgekin();
  document.querySelector('#layout').onclick=()=>{document.querySelector('#wall').style.left='830px'};
</script>
</html>

<!doctype html><html lang="zh"><meta charset="utf-8"><title>Edgekin 0.1 轮廓验证</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#1f2328;font:16px system-ui}header{height:80px;background:#f6f8fa;border-bottom:1px solid #d0d7de;display:flex;align-items:center;gap:18px;padding:14px 24px}button,input{border:1px solid #d0d7de;background:#f6f8fa;border-radius:8px;padding:10px 18px;font:inherit}.avatar{display:inline-block;width:38px;height:38px;border-radius:50%;background:#9257df;border:1px solid #8040b8}.panel{border:1px solid #d0d7de;border-radius:12px;padding:20px;background:white}.sidebar{position:absolute;top:110px;left:24px;width:225px}.center{position:absolute;left:285px;top:105px;width:620px}.right{position:absolute;top:115px;left:940px;width:290px}.ask{height:190px;margin-top:30px}.row{display:flex;gap:16px;align-items:center;margin-top:24px}.feed{margin-top:38px;height:240px}.inner{margin-top:20px;padding:18px;background:#f6f8fa;border:1px solid #d0d7de;border-radius:8px}.right .panel{margin-bottom:42px;height:175px}.testing{position:fixed;left:24px;top:360px;width:225px;z-index:2;background:white;padding:8px;border-radius:8px;font-size:12px}h2{margin:0}p{line-height:1.5}
</style>
<header><button>☰</button><span class="avatar"></span><strong>Dashboard</strong><input placeholder="Type to search" style="margin-left:240px;width:280px"><button>＋</button><button>◉</button><span class="avatar"></span></header>
<aside class="sidebar"><h3>Top repositories</h3><input placeholder="Find a repository" style="width:225px"><p><span class="avatar"></span> Project A</p><p><span class="avatar"></span> Project B</p></aside>
<main class="center"><h2>Home</h2><section class="panel ask">Ask anything or type to add context<div class="row"><button>Ask ▾</button><button>All repositories</button><button>＋</button></div></section><div class="row"><button>Debug</button><button>Agent</button><button>Create issue</button><button>Git</button></div><section class="panel feed"><span class="avatar"></span> Repository released<h2>Release notes</h2><div class="inner">Version information<p>Read more</p></div></section></main>
<aside class="right"><section class="panel"><h2>Universe</h2><p>News and sessions</p><button>Register now</button></section><section class="panel"><h2>Learn. Grow.</h2><p>Explore projects</p><button>Get started</button></section></aside>
<div class="testing" data-edgekin-ignore><button id="start">开始验证</button><button id="new">重新生成</button><span id="result"></span><pre id="metrics" style="display:none"></pre><pre id="world" style="display:none"></pre><pre id="run-metrics" style="display:none"></pre></div>
<script type="module">
import {mountEdgekin} from '/dist/index.js';
import {scanPage} from '/dist/scanner.js';
import {openingCount} from '/dist/contours.js';
const game=mountEdgekin();
window.edgekin=game;
const icons=document.createElement('div');icons.style.cssText='display:flex;gap:20px;margin-top:10px';
for(let i=0;i<16;i++){const icon=document.createElement('span');icon.className='small-icon';icon.style.cssText='display:inline-block;width:14px;height:14px;font-size:12px;line-height:14px';icon.textContent=['★','♥','⚙','◆'][i%4];icons.append(icon)}
document.querySelector('.inner').append(icons);
function report(){const begin=performance.now();const w=scanPage(document.body);const scanMs=performance.now()-begin;const nested=w.shapes.filter(s=>w.shapes.some(o=>o!==s&&o.left<=s.left&&o.right>=s.right&&o.top<=s.top&&o.bottom>=s.bottom));const m={shapes:w.shapes.length,small:w.shapes.filter(s=>Math.max(s.right-s.left,s.bottom-s.top)<=32).length,ellipses:w.shapes.filter(s=>s.kind==='ellipse').length,nested:nested.length,platforms:w.platforms.length,internalPlatforms:w.platforms.filter(p=>nested.some(s=>s.id===p.shapeId)).length,opened:w.shapes.filter(s=>s.openings?.length).length,openings:w.shapes.reduce((n,s)=>n+openingCount(s),0),coverage:w.contourStats,scanMs};document.querySelector('#metrics').textContent=JSON.stringify(m);document.querySelector('#world').textContent=JSON.stringify(w);document.querySelector('#result').textContent=`轮廓 ${m.shapes}，小图标 ${m.small}，开口 ${m.openings}`}
async function startRun(regenerate=false){if(regenerate)await game.regenerate();await game.start();const stats=game.getMapStats();document.querySelector('#run-metrics').textContent=JSON.stringify(stats);document.querySelector('#result').textContent=`轮廓 ${stats?.outlineCount??0}，生成 ${stats?.generationMs.toFixed(0)??'—'} ms`}
document.querySelector('#start').onclick=()=>startRun();
document.querySelector('#new').onclick=()=>startRun(true);
report();
</script></html>
